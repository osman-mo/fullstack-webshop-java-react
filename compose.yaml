services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: webshop
      MYSQL_USER: webshop
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -u root --password="$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/webshop?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: webshop
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: demo
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
